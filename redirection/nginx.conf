server {
    listen 80;
    server_name futurpro.inserjeunes.beta.gouv.fr;

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name futurpro.inserjeunes.beta.gouv.fr;

    ssl_certificate /etc/letsencrypt/live/futurpro.inserjeunes.beta.gouv.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/futurpro.inserjeunes.beta.gouv.fr/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # /recherche — preserve only address param
    location = /recherche {
        if ($arg_address) {
            return 301 https://data.education.gouv.fr/futur-pro/recherche/?address=$arg_address;
        }
        return 301 https://data.education.gouv.fr/futur-pro/recherche/;
    }

    # /details/{slug} — convert path param to query param, preserve only latitude & longitude
    location ~ ^/details/(.+)$ {
        set $slug $1;
        set $extra "";
        if ($arg_latitude) {
            set $extra "&latitude=$arg_latitude";
        }
        if ($arg_longitude) {
            set $extra "$extra&longitude=$arg_longitude";
        }
        return 301 https://data.education.gouv.fr/futur-pro/details/?slug=$slug$extra;
    }

    # Everything else — redirect to home
    location / {
        return 301 https://data.education.gouv.fr/futur-pro/;
    }
}
